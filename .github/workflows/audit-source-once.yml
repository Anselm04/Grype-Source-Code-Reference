name: Verify pinned Git source tree grype
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/anchore/grype.git
      upstream_sha: 6b58d49475713089136ce884a103a867c487bca9
      audit_slug: grype
