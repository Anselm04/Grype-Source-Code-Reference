name: Import pinned Grype source directly onto main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-grype-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grype-reference-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Import Grype source, preserve licences and verify remote
        shell: bash
        env:
          PINNED_SHA: '6b58d49475713089136ce884a103a867c487bca9'
          PINNED_TREE: '2c2d2370071bdf9eb857e1aabb9e23adfcc3d6c7'
        run: |
          set -euo pipefail
          git config user.name 'TrillionAI Source Archive Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add source-upstream https://github.com/anchore/grype.git
          git fetch --no-tags --depth=1 source-upstream "$PINNED_SHA"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$PINNED_SHA" || {
            echo "::error::Upstream commit SHA mismatch"
            exit 1
          }
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$PINNED_TREE" || {
            echo "::error::Upstream tree SHA mismatch"
            exit 1
          }
          git cat-file -e "$PINNED_SHA:LICENSE"
          git cat-file -e "$PINNED_SHA:COPYRIGHT"

          reference_blob="$(git rev-parse 'HEAD:README.md')"
          git read-tree --reset "$PINNED_TREE"
          git update-index --add --cacheinfo "100644,$reference_blob,TRILLIONAI_REFERENCE.md"
          # Never execute or retain imported upstream CI workflows.
          git ls-files -z '.github/workflows/' | xargs -0 -r git rm -r --cached --

          git ls-tree -rz --full-tree "$PINNED_TREE" > /tmp/grype-upstream-git-tree
          git ls-files --stage -z > /tmp/grype-import-index
          python3 - <<'PY'
          from pathlib import Path
          def parse(data, index):
              out = {}
              for row in data.split(b'\0'):
                  if not row:
                      continue
                  metadata, path = row.split(b'\t', 1)
                  fields = metadata.split()
                  out[path] = (fields[0], fields[1 if index else 2])
              return out
          original = parse(Path('/tmp/grype-upstream-git-tree').read_bytes(), False)
          destination = parse(Path('/tmp/grype-import-index').read_bytes(), True)
          mismatches = [p for p, identity in original.items()
                        if not p.startswith(b'.github/workflows/')
                        and destination.get(p) != identity]
          unexpected = set(destination) - set(original)
          if mismatches or unexpected != {b'TRILLIONAI_REFERENCE.md'}:
              raise SystemExit(f'Verification failed: mismatches={mismatches[:5]!r}, extra={unexpected!r}')
          print(f'VERIFIED ORIGINAL SOURCE FILE OBJECTS: {len(original)}')
          PY

          git commit -m "archive: install pinned Grype source directly on main"
          git push origin HEAD:main
          git fetch --no-tags origin main
          local_tree="$(git rev-parse 'HEAD^{tree}')"
          remote_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          test "$local_tree" = "$remote_tree" || {
            echo "::error::Remote main Git tree mismatch"
            exit 1
          }
          echo "VERIFIED UPSTREAM COMMIT: $PINNED_SHA"
          echo "VERIFIED ORIGINAL SOURCE TREE: $PINNED_TREE"
          echo "VERIFIED REMOTE MAIN TREE: $remote_tree"
          echo "SOURCE FILES ON MAIN; UPSTREAM LICENSE AND COPYRIGHT PRESERVED"
